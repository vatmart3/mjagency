<style>
:root {
  color-scheme: light;
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #0B1220;
  --muted: #5A6475;
  --line: #DFE4EB;
  --accent: #0071E3;
  --accent-soft: #E6EFFC;
  --danger: #C62F2F;
  --ok: #0F8A5F;
  --on-accent: #FFFFFF;
  --field: #FFFFFF;
  --hover-line: #B9C2CE;
  --shadow-card: 0 1px 2px rgba(11, 18, 32, .04), 0 12px 40px -18px rgba(11, 18, 32, .16);
  --shadow-mock: 0 2px 4px rgba(11, 18, 32, .05), 0 24px 48px -16px rgba(11, 18, 32, .22), 0 60px 90px -40px rgba(11, 18, 32, .32);

  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-text: "Onest", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --font-logo: "Poppins", "Avenir Next", Futura, "Century Gothic", "Segoe UI", system-ui, sans-serif;

  --radius: 22px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --top-h: 60px;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0A0D12;
    --surface: #12161D;
    --ink: #EDF1F6;
    --muted: #98A2B3;
    --line: #252C37;
    --accent: #3B93F5;
    --accent-soft: #10243F;
    --danger: #EF6A6A;
    --ok: #34B889;
    --on-accent: #FFFFFF;
    --field: #0E1218;
    --hover-line: #3A4352;
    --shadow-card: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 20px 50px -24px rgba(0, 0, 0, .7);
    --shadow-mock: 0 2px 4px rgba(0, 0, 0, .3), 0 28px 56px -18px rgba(0, 0, 0, .7), 0 60px 100px -40px rgba(0, 0, 0, .8);
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-text);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
@supports (overflow: clip) { body { overflow-x: clip; } }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
::selection { background: var(--accent-soft); color: var(--ink); }

/* ---------- Barre du haut ---------- */
.top {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  -webkit-backdrop-filter: saturate(170%) blur(18px);
  backdrop-filter: saturate(170%) blur(18px);
  border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
}
.top-in {
  max-width: 1280px; margin: 0 auto; height: var(--top-h);
  padding: 0 max(16px, env(safe-area-inset-left)) 0 max(16px, env(safe-area-inset-right));
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
@media (min-width: 700px) { .top-in { padding: 0 32px; } }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo { font-family: var(--font-logo); font-weight: 700; font-size: 23px; letter-spacing: -.02em; line-height: 1; color: var(--ink); }
.logo .dot { color: var(--accent); }
.brand-sep { width: 1px; height: 18px; background: var(--line); }
.brand-title { font-size: 14px; font-weight: 500; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 640px) { .brand-sep, .brand-title { display: none; } }
.step-count { font-family: var(--font-mono); font-weight: 500; font-size: 12px; letter-spacing: .06em; color: var(--muted); white-space: nowrap; }
.step-count b { color: var(--ink); font-weight: 500; }
.progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: transparent; }
.progress-bar { height: 100%; width: 12.5%; background: var(--accent); border-radius: 0 2px 2px 0; transition: width .6s var(--ease); }

/* ---------- Mise en page ---------- */
.layout {
  max-width: 1280px; margin: 0 auto;
  padding: 28px 16px 72px;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px;
}
@media (min-width: 700px) { .layout { padding: 36px 32px 96px; } }
@media (min-width: 1000px) {
  .layout { grid-template-columns: minmax(0, 1fr) 430px; gap: 48px; align-items: start; }
}

/* ---------- Rail des étapes ---------- */
.rail { margin: 0 0 20px; }
.rail ol { position: relative; list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
@media (max-width: 999px) {
  .rail { margin: 0 -16px 18px; }
  .rail ol {
    flex-wrap: nowrap; overflow-x: auto; padding: 4px 16px 6px;
    scroll-snap-type: x proximity; scrollbar-width: none; -ms-overflow-style: none;
    scroll-padding-inline: 16px;
  }
  .rail ol::-webkit-scrollbar { display: none; }
  .rail li { scroll-snap-align: start; flex: none; }
}
@media (min-width: 700px) and (max-width: 999px) { .rail { margin: 0 -32px 18px; } .rail ol { padding: 4px 32px 6px; scroll-padding-inline: 32px; } }
.rail-btn {
  position: relative; display: inline-flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 14px 0 12px;
  border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
  font-size: 14px; font-weight: 500; white-space: nowrap;
  transition: border-color .2s, box-shadow .2s, background .2s;
}
.rail-btn:hover { border-color: var(--hover-line); }
.rail-num { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: .02em; }
.rail-btn[aria-current="step"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.rail-check {
  display: none; width: 16px; height: 16px; border-radius: 50%;
  background: var(--accent); color: #fff; align-items: center; justify-content: center; margin-left: 2px;
}
.rail-btn.is-done .rail-check { display: inline-flex; }
.rail-check svg { width: 10px; height: 10px; }

/* ---------- Carte formulaire ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow-card);
  padding: 28px 20px 24px;
  scroll-margin-top: calc(var(--top-h) + 16px);
}
@media (min-width: 700px) { .card { padding: 44px 44px 32px; } }
.step[data-enter] > * { animation: stepIn .5s var(--ease) both; }
.step[data-enter] > *:nth-child(2) { animation-delay: .04s; }
.step[data-enter] > *:nth-child(3) { animation-delay: .08s; }
.step[data-enter] > *:nth-child(n+4) { animation-delay: .12s; }
@keyframes stepIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

.eyebrow { margin: 0 0 14px; font-family: var(--font-mono); font-weight: 500; font-size: 12px; letter-spacing: .12em; color: var(--accent); }
.step-title {
  margin: 0; font-family: var(--font-display); font-weight: 700;
  font-size: clamp(30px, 2.4vw + 18px, 48px); line-height: 1.04; letter-spacing: -.025em;
  text-wrap: balance; font-variation-settings: "opsz" 72;
}
.step-title:focus, .step-title:focus-visible, #success-title:focus, .alert:focus { outline: none; }
.step-intro { margin: 14px 0 0; max-width: 58ch; color: var(--muted); font-size: 17px; line-height: 1.55; text-wrap: pretty; }

/* ---------- Champs ---------- */
.fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 26px 18px; margin-top: 36px; }
.field { position: relative; grid-column: 1 / -1; min-width: 0; }
@media (min-width: 640px) { .field.half { grid-column: auto; } }
.label { display: block; margin: 0 0 9px; font-size: 15px; font-weight: 600; line-height: 1.35; color: var(--ink); }
.req { color: var(--accent); margin-left: 2px; }
.input {
  display: block; width: 100%; min-height: 50px;
  padding: 12px 15px; border-radius: 13px;
  border: 1px solid var(--line); background: var(--field); color: var(--ink);
  font-size: 16px; line-height: 1.45;
  transition: border-color .18s, box-shadow .18s;
  -webkit-appearance: none; appearance: none;
}
.input::placeholder { color: color-mix(in srgb, var(--muted) 72%, transparent); }
.input:hover { border-color: var(--hover-line); }
.input:focus, .input:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
textarea.input { resize: vertical; min-height: 0; }
input[type="date"].input { min-width: 0; }
input[type="date"].input::-webkit-date-and-time-value { text-align: left; }
.input[aria-invalid="true"] { border-color: var(--danger); }
.input[aria-invalid="true"]:focus { box-shadow: 0 0 0 4px color-mix(in srgb, var(--danger) 16%, transparent); }
.help { margin: 8px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
.err { margin: 8px 0 0; font-size: 13.5px; color: var(--danger); font-weight: 500; display: flex; gap: 6px; align-items: flex-start; }
.err::before {
  content: ""; flex: none; width: 14px; height: 14px; margin-top: 2px; border-radius: 50%;
  border: 1.5px solid currentColor;
  background-image: linear-gradient(currentColor, currentColor), linear-gradient(currentColor, currentColor);
  background-size: 1.5px 5px, 1.5px 1.5px; background-position: 50% 2.2px, 50% 8.4px; background-repeat: no-repeat;
}
.limit-msg { color: var(--danger); font-weight: 500; }

/* Pastilles */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; min-height: 40px;
  padding: 8px 15px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--field); color: var(--ink);
  font-size: 14.5px; font-weight: 500; line-height: 1.25; text-align: left;
  transition: background .18s, color .18s, border-color .18s, transform .12s;
}
.chip:hover { border-color: var(--hover-line); }
.chip:active { transform: scale(.97); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-disabled="true"] { opacity: .45; }

/* Couleurs */
.colors { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch {
  display: inline-flex; align-items: center; gap: 10px;
  height: 46px; padding: 0 6px 0 6px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--field);
}
.swatch-pick { position: relative; width: 34px; height: 34px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
.swatch-pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }
.swatch-pick:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }
.swatch-hex { font-family: var(--font-mono); font-size: 13px; font-weight: 500; letter-spacing: .02em; min-width: 62px; }
.swatch-rm {
  width: 30px; height: 30px; border-radius: 50%; border: 0; background: transparent; color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center;
}
.swatch-rm:hover { background: var(--accent-soft); color: var(--ink); }
.swatch-rm svg { width: 14px; height: 14px; }
.add-color {
  height: 46px; padding: 0 18px; border-radius: 999px;
  border: 1.5px dashed var(--hover-line); background: transparent; color: var(--ink);
  font-size: 14.5px; font-weight: 500;
  transition: border-color .18s, color .18s;
}
.add-color:hover { border-color: var(--accent); color: var(--accent); }

/* ---------- Pied d'étape ---------- */
.step-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--line);
}
.foot-note { margin: 0; font-size: 13.5px; color: var(--muted); max-width: 26ch; line-height: 1.4; }
@media (min-width: 640px) { .foot-note { max-width: none; } }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 24px; border-radius: 999px; border: 1px solid transparent;
  font-size: 15.5px; font-weight: 600; letter-spacing: -.005em; white-space: nowrap; text-decoration: none;
  transition: background .2s, border-color .2s, color .2s, transform .12s, box-shadow .2s;
}
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 6px 18px -8px color-mix(in srgb, var(--accent) 70%, transparent); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-secondary:hover { border-color: var(--hover-line); }
.btn-ghost { background: transparent; color: var(--ink); padding: 0 10px; margin-left: -10px; }
.btn-ghost:hover { color: var(--accent); }
.btn-sm { min-height: 38px; padding: 0 16px; font-size: 14px; }
.link-btn { border: 0; background: none; padding: 4px 2px; color: var(--accent); font-weight: 600; font-size: 14px; }
.link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }
.arrow { transition: transform .2s var(--ease); display: inline-block; }
.btn:hover .arrow { transform: translateX(3px); }

/* ---------- Étape 8 ---------- */
.recap { list-style: none; margin: 34px 0 0; padding: 0; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.recap li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 14px; padding: 14px 16px; border-top: 1px solid var(--line); }
.recap li:first-child { border-top: 0; }
.recap-num { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.recap-title { font-weight: 600; font-size: 15px; line-height: 1.3; }
.recap-meta { display: block; font-size: 13.5px; font-weight: 400; color: var(--muted); margin-top: 2px; }
.recap-meta.is-missing { color: var(--danger); font-weight: 500; }
.sub-h { margin: 36px 0 12px; font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: -.015em; }
.sig-wrap { margin-top: 26px; }
.sig-sheet {
  position: relative; height: 200px; border-radius: 16px; overflow: hidden;
  background: #FFFFFF; border: 1px solid var(--line);
  box-shadow: inset 0 1px 3px rgba(11, 18, 32, .05);
}
.sig-sheet canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; display: block; }
.sig-base { position: absolute; left: 24px; right: 24px; bottom: 52px; border-top: 1.5px dashed #C5CDD8; pointer-events: none; }
.sig-x { position: absolute; left: 24px; bottom: 58px; font-family: var(--font-mono); font-size: 13px; color: #98A2B3; pointer-events: none; }
.sig-hint { position: absolute; left: 0; right: 0; bottom: 20px; text-align: center; font-size: 13px; color: #8A94A6; pointer-events: none; }
.sig-tools { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
.check {
  display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; align-items: start;
  margin-top: 28px; padding: 16px; border-radius: 14px; border: 1px solid var(--line); cursor: pointer;
  transition: border-color .2s, background .2s;
}
.check:hover { border-color: var(--hover-line); }
.check input { appearance: none; -webkit-appearance: none; margin: 1px 0 0; width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--hover-line); background: var(--field); display: grid; place-content: center; cursor: pointer; transition: background .15s, border-color .15s; }
.check input::after { content: ""; width: 11px; height: 6px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px) scale(0); transition: transform .15s var(--ease); }
.check input:checked { background: var(--accent); border-color: var(--accent); }
.check input:checked::after { transform: rotate(-45deg) translate(1px, -1px) scale(1); }
.check input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.check input[aria-invalid="true"] { border-color: var(--danger); }
.check span { font-size: 15px; line-height: 1.5; }
.check:has(input:checked) { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background: color-mix(in srgb, var(--accent-soft) 45%, transparent); }
.validate-row { margin-top: 26px; display: flex; justify-content: flex-end; }
@media (max-width: 520px) { .validate-row .btn { width: 100%; } }
.alert {
  margin-top: 24px; padding: 16px 18px; border-radius: 14px;
  border: 1px solid color-mix(in srgb, var(--danger) 45%, transparent);
  background: color-mix(in srgb, var(--danger) 7%, var(--surface));
}
.alert-title { margin: 0 0 8px; font-weight: 600; color: var(--danger); }
.alert ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.alert li { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14.5px; }

/* Succès */
.success { text-align: center; padding: 16px 0 4px; }
.success-mark { width: 76px; height: 76px; margin: 0 auto 22px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; animation: pop .55s var(--ease) both; }
.success-mark svg { width: 38px; height: 38px; }
.success-mark path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .5s .3s var(--ease) forwards; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
.success h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 2.4vw + 18px, 44px); letter-spacing: -.025em; line-height: 1.05; }
.ref { display: inline-block; margin-top: 14px; padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-family: var(--font-mono); font-weight: 500; font-size: 13px; letter-spacing: .04em; }
.success p.lead { margin: 18px auto 0; max-width: 46ch; color: var(--muted); font-size: 16.5px; text-wrap: pretty; }
.success-actions { margin-top: 26px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
@media (max-width: 520px) { .success-actions .btn { width: 100%; } }
.contact-box { margin: 30px auto 0; max-width: 460px; text-align: left; border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
.contact-box .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; color: var(--muted); margin: 0 0 10px; }
.contact-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.contact-row:first-of-type { border-top: 0; padding-top: 0; }
.contact-row a { color: var(--ink); font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
.contact-row a:hover { color: var(--accent); }
.success-more { margin-top: 26px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 22px; }
.confirm-inline { display: inline-flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px; font-size: 14.5px; }
.link-danger { color: var(--danger); }

/* ---------- Aperçu ---------- */
.preview { min-width: 0; }
@media (min-width: 1000px) { .preview { position: sticky; top: calc(var(--top-h) + 24px); } }
.preview-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-family: var(--font-mono); font-weight: 500; font-size: 11px; letter-spacing: .1em; color: var(--muted); }
.live { display: inline-flex; align-items: center; gap: 7px; color: var(--accent); }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); animation: pulse 2s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 0%, transparent); } }

  /* ---------- Pad de signature ---------- */
  var sig = { canvas: null, ctx: null, drawing: false, pts: [], w: 0, h: 0, bound: false };
  function setupSignature() {
    var c = $('f-signature');
    if (!c || !c.offsetWidth) return;
    var dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    var w = c.offsetWidth, h = c.offsetHeight;
    sig.canvas = c; sig.w = w; sig.h = h;
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    var ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0B1220'; ctx.lineWidth = 2.3;
    sig.ctx = ctx;
    ctx.clearRect(0, 0, w, h);
    var data = state.answers.signature;
    if (data) {
      var img = new Image();
      img.onload = function () {
        var r = img.naturalWidth / img.naturalHeight, dw = w, dh = w / r;
        if (dh > h) { dh = h; dw = h * r; }
        ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
      };
      img.src = data;
    }
    updateSigUI();
    if (!sig.bound) bindSignature(c);
  }
  function updateSigUI() {
    var has = isFilled(state.answers.signature);
    $('sig-hint').hidden = has;
    $('sig-status').textContent = has ? 'Signature enregistrée.' : '';
    $('sig-clear').hidden = !has;
  }
  function bindSignature(c) {
    sig.bound = true;
    function pos(e) { var r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    c.addEventListener('pointerdown', function (e) {
      if (e.button !== undefined && e.button !== 0) return;
      e.preventDefault();
      try { c.setPointerCapture(e.pointerId); } catch (er) { /* ignoré */ }
      sig.drawing = true;
      var p = pos(e);
      sig.pts = [p];
      var ctx = sig.ctx;
      ctx.beginPath(); ctx.arc(p.x, p.y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fillStyle = '#0B1220'; ctx.fill();
      $('sig-hint').hidden = true;
    });
    c.addEventListener('pointermove', function (e) {
      if (!sig.drawing) return;
      e.preventDefault();
      var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      if (!evs.length) evs = [e];
      var ctx = sig.ctx;
      evs.forEach(function (ev) {
        var p = pos(ev), pts = sig.pts;
        pts.push(p);
        var n = pts.length;
        if (n < 3) { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(p.x, p.y); ctx.stroke(); return; }
        var a = pts[n - 3], b = pts[n - 2];
        var m1 = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, m2 = { x: (b.x + p.x) / 2, y: (b.y + p.y) / 2 };
        ctx.beginPath(); ctx.moveTo(m1.x, m1.y); ctx.quadraticCurveTo(b.x, b.y, m2.x, m2.y); ctx.stroke();
      });
    });
    function end() {
      if (!sig.drawing) return;
      sig.drawing = false;
      sig.pts = [];
      setAnswer('signature', c.toDataURL('image/png'));
      updateSigUI();
    }
    c.addEventListener('pointerup', end);
    c.addEventListener('pointercancel', end);
    c.addEventListener('lostpointercapture', end);
    $('sig-clear').addEventListener('click', function () {
      sig.ctx.clearRect(0, 0, sig.w, sig.h);
      setAnswer('signature', '');
      updateSigUI();
      toast('Signature effacée');
    });
    var rt = 0;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () { if (state.step === 7 && !state.validated && sig.canvas && sig.canvas.offsetWidth !== sig.w) setupSignature(); }, 150);
    });
  }

  function bindTilt() {

      if (e.key === 'Enter' && e.target.matches('input.input')) {

      if (rm) {

        setAnswer('colors', cols);

        c2.push(pick);

    } else {

      var at = arr.indexOf(v);
      var limit = $('f-' + id + '-limit');
      if (at > -1) {
        arr.splice(at, 1);
        if (id === 'pages' && v === 'Accueil' && arr.length) { /* on peut retirer l'accueil volontairement */ }

  function copyText(text, okMsg) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      toast(ok ? okMsg : 'Copie impossible : sélectionnez le texte à la main');
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback);
    } else fallback();
  }
  function answerText(f) {
    var v = state.answers[f.id];
    if (!isFilled(v)) return '';

    if (f.type === 'colors') return v.map(function (c) { return c.toUpperCase(); }).join(', ');

  // Les polices standard de jsPDF ne couvrent que le Latin-1 (+ €).
  function clean(s) {
    return String(s == null ? '' : s)
      .normalize('NFC')
      .replace(/\r\n?/g, '\n')
      .replace(/[\u2018\u2019\u201A\u201B\u2032\u00B4]/g, "'")
      .replace(/[\u201C\u201D\u201E\u201F\u2033]/g, '"')
      .replace(/[\u2010\u2011\u2012\u2013\u2014\u2015\u2212]/g, '-')
      .replace(/\u2026/g, '...')
      .replace(/[\u00A0\u2000-\u200A\u202F\u205F\u3000\t]/g, ' ')
      .replace(/\u0153/g, 'oe').replace(/\u0152/g, 'OE')
      .replace(/[\u2022\u2023\u25CF]/g, '\u00B7')
      .replace(/[\u200B-\u200D\u2060\uFEFF]/g, '')
      .replace(/[^\n\x20-\x7E\u00A0-\u00FF\u20AC]/g, '')
      .replace(/ {2,}/g, ' ');
  }

  function loadImage(src) {
    return new Promise(function (res, rej) { var i = new Image(); i.onload = function () { res(i); }; i.onerror = rej; i.src = src; });
  }
  // Recadre la signature sur son tracé pour qu'elle remplisse le cadre du PDF
  function cropSignature(dataUrl) {
    return loadImage(dataUrl).then(function (img) {
      var c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      var ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      var d = ctx.getImageData(0, 0, c.width, c.height).data;
      var minX = c.width, minY = c.height, maxX = -1, maxY = -1;
      for (var y = 0; y < c.height; y++) {
        for (var x = 0; x < c.width; x++) {
          if (d[(y * c.width + x) * 4 + 3] > 12) {
            if (x < minX) minX = x; if (x > maxX) maxX = x;
            if (y < minY) minY = y; if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < 0) return null;
      var pad = Math.round(Math.max(c.width, c.height) * 0.02);
      minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
      maxX = Math.min(c.width - 1, maxX + pad); maxY = Math.min(c.height - 1, maxY + pad);
      var w = maxX - minX + 1, h = maxY - minY + 1;
      var out = document.createElement('canvas');
      out.width = w; out.height = h;
      var o = out.getContext('2d');
      o.fillStyle = '#FFFFFF'; o.fillRect(0, 0, w, h);
      o.drawImage(c, minX, minY, w, h, 0, 0, w, h);
      return { data: out.toDataURL('image/png'), w: w, h: h };
    }).catch(function () { return null; });
  }

  function buildPdf(sigImg) {
    var jsPDF = window.jspdf.jsPDF;

    var LH = 4.8, LBL = 4.3, GAP = 3.6;

    function color(c) { doc.setTextColor(c[0], c[1], c[2]); }

    function text(s, x, y, opt) { doc.text(clean(s), x, y, opt || {}); }
    function split(s, w) { return doc.splitTextToSize(clean(s), w); }
    function truncate(s, w) {

    var y = 0;

    }
    function newPage() { doc.addPage(); contHeader(); }
    function ensure(h) { if (y + h > BOTTOM) { newPage(); return true; } return false; }

    /* --- Bandeau --- */
    doc.setFillColor(ACC[0], ACC[1], ACC[2]);
    doc.rect(0, 0, W, 50, 'F');
    font('bold', 24); doc.setTextColor(255, 255, 255);
    doc.text('MJ', M, 19);

    doc.setFillColor(255, 255, 255);
    doc.circle(M + mjw + 1.9, 18.1, 1.25, 'F');
    font('normal', 7); doc.setTextColor(214, 231, 251);
    doc.setCharSpace(0.55);
    text('MJAGENCY · AGENCE WEB · SÈTE', M, 25.5);
    doc.setCharSpace(0);
    font('bold', 20); doc.setTextColor(255, 255, 255);
    text('Brief de création de site web', M, 40.5);
    font('bold', 9.5);
    text('Réf. ' + ref, W - M, 19, { align: 'right' });
    font('normal', 9); doc.setTextColor(214, 231, 251);
    text(longDate(when), W - M, 24.5, { align: 'right' });
    y = 60;

    /* --- Carte client --- */
    var LX = M + 7, LW = 100, RX = M + 120, RW = CW - 120 - 7;
    font('bold', 16);
    var coLines = split(company, LW);
    font('normal', 10);
    var who = [val('contactName'), val('contactRole')].filter(Boolean).join(', ');
    var reach = [val('phone'), val('email')].filter(Boolean).join(' · ');
    var where = [val('address'), val('city')].filter(Boolean).join(', ');
    var infoLines = [];
    [who, reach, where].forEach(function (s) { if (s) infoLines = infoLines.concat(split(s, LW)); });
    var leftH = 5 + coLines.length * 6.6 + 1.5 + infoLines.length * 4.9;
    font('bold', 10.5);
    var projLines = split(val('siteType') || 'Non renseigné', RW);
    var budLines = split(val('budget') || 'Non renseigné', RW);
    var rightH = 5 + projLines.length * 4.9 + 5 + 5 + budLines.length * 4.9;
    var cardH = Math.max(leftH, rightH) + 14;
    doc.setFillColor(PALE[0], PALE[1], PALE[2]);
    doc.roundedRect(M, y, CW, cardH, 3.5, 3.5, 'F');
    var cy = y + 9;
    font('bold', 7); color(ACC); doc.setCharSpace(0.4);

    budLines.forEach(function (l) { doc.text(l, RX, ry); ry += 4.9; });
    y += cardH + 11;

    /* --- Sections --- */
    function sectionTitle(num, title) {
      ensure(24);
      font('bold', 13); color(ACC);

      doc.setDrawColor(LINE[0], LINE[1], LINE[2]); doc.setLineWidth(0.3);
      doc.line(M, y + 8, W - M, y + 8);

    }
    function fieldModel(f, width) {
      var v = a[f.id];
      font('bold', 7);
      var label = split(f.label.toLocaleUpperCase('fr-FR'), width);
      var m = { label: label, kind: 'text', lines: [] };
      if (!isFilled(v)) { m.kind = 'empty'; m.lines = ['Non renseigné']; }
      else if (f.type === 'colors') { m.kind = 'colors'; m.colors = v.filter(function (c) { return hexToRgb(c); }); m.rows = Math.ceil(m.colors.length / Math.max(1, Math.floor(width / 30))); }
      else { font('normal', 10); m.lines = split(answerText(f), width); }
      m.h = label.length * 3.3 + (LBL - 3.3) + (m.kind === 'colors' ? m.rows * 7 : m.lines.length * LH);

    function drawLabel(m, x) {
      font('bold', 7); color(MUT); doc.setCharSpace(0.25);
      m.label.forEach(function (l, k) { doc.text(l, x, y + 2.6 + k * 3.3); });
      doc.setCharSpace(0);
      y += m.label.length * 3.3 + (LBL - 3.3);
    }
    function drawColors(m, x, width) {
      var per = Math.max(1, Math.floor(width / 30));
      m.colors.forEach(function (c, k) {
        var col = k % per, row = Math.floor(k / per);
        var cx = x + col * 30, cyy = y + row * 7;
        var rgb = hexToRgb(c);

        doc.circle(cx + 2.6, cyy + 2.5, 2.6, 'FD');
        font('normal', 9.5); color(INK);
        doc.text(c.toUpperCase(), cx + 7, cyy + 3.7);
      });
      y += m.rows * 7;
    }
    function valueStyle(m) {
      if (m.kind === 'empty') { font('italic', 10); color(LIGHT); }
      else { font('normal', 10); color(INK); }
    }
    // Champ pleine largeur, coupé ligne par ligne si besoin
    function drawFull(f, x, width) {
      var m = fieldModel(f, width);
      ensure(m.label.length * 3.3 + LBL + (m.kind === 'colors' ? 7 : LH));
      drawLabel(m, x);
      if (m.kind === 'colors') { drawColors(m, x, width); }
      else {
        m.lines.forEach(function (l) {
          if (y + LH > BOTTOM) { newPage(); }
          valueStyle(m);
          doc.text(l, x, y + 3.6);
          y += LH;
        });

      y += GAP;
    }
    function drawPair(f1, f2) {
      var cw = (CW - 8) / 2;
      var m1 = fieldModel(f1, cw), m2 = fieldModel(f2, cw);

      ensure(h);
      var y0 = y;
      [[m1, M], [m2, M + cw + 8]].forEach(function (pair) {

        drawLabel(m, x);
        if (m.kind === 'colors') drawColors(m, x, cw);
        else { valueStyle(m); m.lines.forEach(function (l) { doc.text(l, x, y + 3.6); y += LH; }); }
      });
      y = y0 + h + GAP;

    STEPS.slice(0, 7).forEach(function (s, i) {
      sectionTitle(pad2(i + 1), s.pdf);
      var fs = s.fields;
      for (var k = 0; k < fs.length; k++) {

    if (sigImg) {
      var aw = bw - 10, ah = boxH - 14;

      var iw = aw, ih = aw / ratio;
      if (ih > ah) { ih = ah; iw = ah * ratio; }
      doc.addImage(sigImg.data, 'PNG', M + 5 + (aw - iw) / 2, y + 10 + (ah - ih) / 2, iw, ih);

    }
    var rx = M + bw + 13;
    font('bold', 11); color(INK);
    text(CONTACT.name, rx, y + 16);
    font('normal', 9.5); color(MUT);
    text('MJAGENCY · Agence web à Sète', rx, y + 21.5);
    color(INK);
    text(CONTACT.email, rx, y + 29);
    text(CONTACT.phone, rx, y + 34.5);
    y += boxH;

    /* --- Pieds de page --- */
    var total = doc.getNumberOfPages();
    for (var p = 1; p <= total; p++) {
      doc.setPage(p);
      doc.setDrawColor(LINE[0], LINE[1], LINE[2]); doc.setLineWidth(0.25);
      doc.line(M, 283, W - M, 283);
      font('normal', 6.5); color(MUT);
      text('MJAGENCY · 54 rue Marceau, 34200 Sète · SIRET 992 328 120 00017 · jeremyvatuonepro@gmail.com · 06 11 71 83 68', M, 287.5);
      text(p + ' / ' + total, W - M, 287.5, { align: 'right' });
    }
    return doc;
  }

  function waitForJsPDF(timeout) {
    return new Promise(function (res, rej) {
      var t0 = Date.now();
      (function check() {
        if (window.jspdf && window.jspdf.jsPDF) return res();
        if (Date.now() - t0 > timeout) return rej(new Error('jsPDF indisponible'));
        setTimeout(check, 120);
      })();
    });
  }

      link.href = url; link.download = name; link.rel = 'noopener';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);

      if (window.console) console.warn(err);
      toast('Le PDF n\'a pas pu être créé. Vérifiez votre connexion et réessayez.');
    }).then(function () {

  }
