<!doctype html>
<!--
  ============================================================================
  MOTEUR DE VIDÉO PROMO — page unique, 1920×1080, boucle de 45 s
  ----------------------------------------------------------------------------
  · Ouvrir dans Chrome, cliquer sur « Play » (ou « Record »).
  · Montage en PLANS COURTS : chaque chapitre enchaîne plusieurs plans
    (CONFIG.chapters[].beats). La durée d'un chapitre = somme de ses plans,
    la durée de la vidéo = somme des chapitres. Tout se recalcule seul.
  · Pour un nouveau client : ne modifier QUE l'objet CONFIG (en tête du
    premier bloc de script) — marque, couleurs, polices, plans, chiffres,
    URLs des screenshots, réglages de capture.
  · Icônes : chaque élément de CONFIG porte un champ « i » (window, cart,
    spark, pin, play, refresh, compass, pen, code, send, clock, gauge, trend,
    mail, phone, doc, check, mobile, monitor, eye, target, shield, server,
    book). Le jeu SVG vit dans le moteur, sous la constante ICONS.
  · Screenshots : renseigner CONFIG.shots.mobile / .desktop. Laissés vides
    (ou en erreur), une maquette de site est générée en DOM : le fichier
    fonctionne hors ligne.
  · Capture : « Record » utilise la capture d'onglet du navigateur et exporte
    un MP4 (repli WebM si le navigateur ne sait pas encoder en MP4) ; arrêt
    automatique en fin de boucle. Choisir « Cet onglet » dans la fenêtre de
    partage. Le nom du fichier reprend la durée et le format.
  · Montages : CONFIG.cut et CONFIG.cuts — 'long' 45 s, 'court' 15 s.
    Touche C, ou ?cut=court dans l'URL.
  · Son : CONFIG.audio.music, une piste en boucle mixée dans l'export, et
    CONFIG.audio.sfx pour les effets (souffles de transition, clics
    d'apparition, défilement, impacts) — synthétisés, aucun fichier requis.
  · Formats : CONFIG.format et CONFIG.formats — 16:9 (YouTube), 9:16 (Reels,
    TikTok, Shorts), 1:1 (fil Instagram). La mise en page se réorganise.
  · Clavier : 1-4 chapitre · espace play/pause · R record · F format ·
    H interface · M couper le son · 0 début.
  · Dépendances : GSAP et Three.js via CDN. Si Three.js n'est pas joignable,
    l'animation tourne à l'identique, sans le décor 3D.
  ============================================================================
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Promo Video Engine — 1920×1080 · 45s</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontLink" rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800;900&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
/* ==========================================================================
   PROMO VIDEO ENGINE — feuille de style
   Perf : tout ce qui bouge pendant la lecture n'anime QUE transform /
   opacity (+ clip-path du masque circulaire, qui reste hors layout).
   ========================================================================== */

:root{
  --violet:#6d2bff;  --violet-2:#b026ff; --violet-3:#3a12a8;
  --ink:#050409;     --paper:#ffffff;    --accent:#c9a7ff;
  --glow:rgba(201,167,255,.55);
  --font-display:'Archivo','Archivo Expanded',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-ui:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#000;color:#fff;overflow:hidden;
  font-family:var(--font-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body.is-recording{cursor:none}

#viewport{position:fixed;inset:0;background:#000}
.stage{
  position:absolute;left:50%;top:50%;width:1920px;height:1080px;
  transform-origin:50% 50%;transform:translate(-50%,-50%);
  overflow:hidden;background:var(--ink);isolation:isolate;contain:strict;
}

/* ---------- fonds ---------- */
.layer{position:absolute;inset:0;pointer-events:none}
.bg-violet{
  background:
    radial-gradient(90% 62% at 50% 30%, rgba(109,43,255,.42) 0%, rgba(12,6,26,0) 62%),
    radial-gradient(70% 60% at 12% 96%, rgba(58,18,168,.30) 0%, rgba(12,6,26,0) 60%),
    radial-gradient(150% 130% at 50% 45%, #0d0720 0%, #060310 60%, #030108 100%);
}
.bg-sky{
  inset:-8%;opacity:0;will-change:opacity;
  background:linear-gradient(178deg,#05091d 0%,#0e1c42 30%,#1e3163 52%,#39416f 72%,#5b4d6e 88%,#7a5c6a 100%);
}
.cloud{position:absolute;border-radius:50%;background:rgba(210,200,235,.20);filter:blur(56px)}
.sky__floor{position:absolute;inset:0;background:linear-gradient(to top,rgba(3,4,14,.72) 0%,rgba(3,4,14,.24) 30%,rgba(3,4,14,0) 52%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.vignette{
  background:radial-gradient(80% 74% at 50% 46%,rgba(0,0,0,0) 46%,rgba(0,0,0,.60) 100%);
  mix-blend-mode:multiply;
}
.scrim{background:radial-gradient(56% 52% at 50% 46%,rgba(4,2,10,.74) 0%,rgba(4,2,10,.40) 56%,rgba(4,2,10,0) 100%)}
.grain{
  inset:-25%;width:150%;height:150%;opacity:.09;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='240' height='240' filter='url(%23n)' opacity='.6'/></svg>");
}
.blackout{background:#020105;opacity:0;will-change:opacity;z-index:60}
.flash{background:#fff;opacity:0;mix-blend-mode:screen;will-change:opacity;z-index:55}
.iris-ring{
  position:absolute;left:50%;top:52%;width:200px;height:200px;margin:-100px 0 0 -100px;
  border-radius:50%;border:2px solid rgba(255,255,255,.5);
  box-shadow:0 0 60px 8px var(--glow),inset 0 0 40px 4px var(--glow);
  opacity:0;transform:scale(.02);will-change:transform,opacity;pointer-events:none;z-index:40;
}

/* ---------- bandeau haut : bug de marque + défilant ---------- */
.topbar{position:absolute;left:0;right:0;top:0;height:104px;z-index:45;display:flex;align-items:center;gap:34px;padding:0 70px}
.bug{display:flex;align-items:center;gap:16px;flex:0 0 auto}
.bug__mark{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(150deg,#fff,#d9c8ff);color:#0a0416;
  font-family:var(--font-display);font-weight:900;font-size:19px;letter-spacing:-.05em;
  box-shadow:0 14px 34px -12px rgba(160,90,255,.9);
}
.bug__name{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:.02em}
.bug__dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px 3px var(--glow)}
.topline{
  margin-left:auto;font-size:14px;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(255,255,255,.38);white-space:nowrap;
}

/* ---------- plans ---------- */
.chapters{position:absolute;inset:0;z-index:20}
.chapter{position:absolute;inset:0}
.beat{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:120px 90px 210px;visibility:hidden;
}
/* Le masque circulaire est posé sur les blocs eux-mêmes (data-iris), jamais
   sur un ancêtre : un clip-path parent annulerait le backdrop-filter. */

/* ---------- carte verre ---------- */
.card{
  position:relative;border-radius:32px;padding:64px;
  background:linear-gradient(158deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.028) 52%,rgba(255,255,255,.06) 100%);
  border:1px solid rgba(255,255,255,.15);
  -webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);
  box-shadow:0 80px 180px -50px rgba(0,0,0,.92),0 8px 40px -12px rgba(0,0,0,.55),
             inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(255,255,255,.05);
}
.card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,.14),rgba(255,255,255,0) 34%);
  mix-blend-mode:screen;
}
.plain{position:relative;width:100%;text-align:center}

/* ---------- typo ---------- */
.eyebrow{
  font-size:16px;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.62);
  display:flex;align-items:center;gap:14px;margin:0 0 30px;
}
.eyebrow b{width:34px;height:1px;background:var(--accent);display:block;opacity:.8}
.eyebrow--c{justify-content:center}
.display{
  font-family:var(--font-display);font-weight:900;letter-spacing:-.052em;line-height:.88;
  margin:0;font-size:118px;text-wrap:balance;
}
.display em{font-style:normal;color:var(--accent)}
.lede{
  margin:28px 0 0;font-family:var(--font-display);font-weight:500;font-size:26px;line-height:1.38;
  letter-spacing:-.015em;color:rgba(255,255,255,.74);max-width:24ch;
}
.lede--c{max-width:none;margin-left:auto;margin-right:auto;text-align:center}
.meta{margin-top:38px;display:flex;align-items:center;gap:14px;font-size:18px;letter-spacing:.12em;color:rgba(255,255,255,.85)}
.meta i{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px 3px var(--glow);display:block}
.mask{
  display:block;overflow:hidden;
  padding:.14em .06em .22em;margin:-.14em 0 -.22em;
}
.mask i{display:block;font-style:normal;will-change:transform}

/* ---------- plan « logo » ---------- */
.lockup{display:flex;flex-direction:column;align-items:center;text-align:center}
.logomark{
  position:relative;width:132px;height:132px;border-radius:36px;
  display:grid;place-items:center;
  background:linear-gradient(150deg,#fff 0%,#d9c8ff 100%);color:#0a0416;
  font-family:var(--font-display);font-weight:900;font-size:48px;letter-spacing:-.06em;
  box-shadow:0 30px 70px -20px rgba(160,90,255,.8),inset 0 -2px 0 rgba(0,0,0,.12);
}
.lockup__name{
  margin:40px 0 0;font-family:var(--font-display);font-weight:900;font-size:96px;
  letter-spacing:-.05em;line-height:1;
}
.rule{width:120px;height:1px;background:rgba(255,255,255,.3);margin:34px 0}

/* ---------- plan « hero » : texte + iPhone ---------- */
.split{display:flex;align-items:center;gap:70px;width:1500px}
.split .col{flex:1;min-width:0}
.phone-wrap{flex:0 0 340px;display:flex;justify-content:center;perspective:1600px}
.phone{
  width:326px;height:640px;border-radius:50px;padding:10px;
  background:linear-gradient(155deg,#3a3a46 0%,#0a0a10 34%,#191922 68%,#08080d 100%);
  box-shadow:0 90px 140px -50px #000,0 0 0 1px rgba(255,255,255,.14),inset 0 0 0 1px rgba(255,255,255,.08);
  transform-style:preserve-3d;will-change:transform;
}
.phone__screen{position:relative;height:100%;border-radius:43px;overflow:hidden;background:#fff}
.phone__notch{
  position:absolute;left:50%;top:20px;width:100px;height:27px;border-radius:14px;
  background:#07070c;transform:translateX(-50%);z-index:3;
}

/* ---------- plan « chips » ---------- */
.chips{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:1320px}
.chip{
  padding:20px 36px;border-radius:999px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.055);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  font-family:var(--font-display);font-weight:700;font-size:29px;letter-spacing:-.015em;
  white-space:nowrap;will-change:transform,opacity;
}
.chip b{color:var(--accent);font-weight:700;margin-right:10px}

/* ---------- icônes : un seul jeu, tracé fin, couleur héritée ---------- */
.ico{display:block;flex:none;width:100%;height:100%}
.ico-box{display:block;width:56px;height:56px;color:var(--accent)}

/* ---------- plan « services » : six cartes, une icône, un mot ---------- */
.svcs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;width:1560px;text-align:left}
.svc{
  padding:40px 36px;border-radius:24px;border:1px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.042);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  display:flex;align-items:center;gap:26px;will-change:transform,opacity;
}
.svc h3{margin:0;font-family:var(--font-display);font-weight:800;font-size:34px;letter-spacing:-.035em}

/* ---------- plan « étapes » : le déroulé du projet ---------- */
.steps{display:flex;gap:26px;width:1660px;text-align:left}
.step{flex:1;padding-top:28px;border-top:2px solid rgba(255,255,255,.16);will-change:transform,opacity}
.step:first-child{border-top-color:var(--accent)}
.step .ico-box{width:44px;height:44px;margin-bottom:22px}
.step b{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.step h3{margin:12px 0 0;font-family:var(--font-display);font-weight:800;font-size:40px;letter-spacing:-.035em}

/* ---------- plan « toujours inclus » : six icônes, six mots ---------- */
.incl{display:flex;gap:0;width:1700px}
.incl__i{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:20px;padding:0 18px;
  border-left:1px solid rgba(255,255,255,.12);will-change:transform,opacity;
}
.incl__i:first-child{border-left:0}
.incl__i span{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-.025em;text-align:center}
.incl .ico-box{width:62px;height:62px}
.incl__i{padding:12px 18px 14px}

/* ---------- petites lignes d'icônes sous un titre ---------- */
.points{display:flex;flex-wrap:wrap;gap:18px 26px;margin-top:34px}
.point{
  display:flex;align-items:center;gap:12px;white-space:nowrap;
  font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em;
}
.point .ico-box{width:28px;height:28px}
.dev-tag{
  display:flex;align-items:center;justify-content:center;gap:12px;margin-top:26px;
  font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.55);
}
.dev-tag .ico-box{width:22px;height:22px;color:rgba(255,255,255,.55)}

/* ---------- plans « chiffres » ---------- */
.stats{display:flex;gap:24px;width:1640px}
.stat{
  flex:1;padding:52px 42px;border-radius:26px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  will-change:transform,opacity;
}
.stat{text-align:left}
.stat .ico-box{width:38px;height:38px;margin-bottom:26px}
.offer__item .ico-box{width:34px;height:34px;margin-bottom:22px}
.tab__ico{width:24px;height:24px;flex:none;opacity:.85}
.stat__num{
  margin:0;font-family:var(--font-display);font-weight:900;font-size:116px;line-height:.9;
  letter-spacing:-.055em;font-variant-numeric:tabular-nums;
}
.stat__num small{font-size:44px;letter-spacing:-.03em;margin-left:4px}
.stat__lab{margin:22px 0 0;font-size:16px;line-height:1.55;color:rgba(255,255,255,.62);letter-spacing:.02em}
.stat--hi{background:linear-gradient(150deg,rgba(176,38,255,.3),rgba(109,43,255,.12));border-color:rgba(255,255,255,.26)}

/* ---------- plan « navigateur » ---------- */
.use{display:flex;align-items:center;gap:56px;width:1740px;padding:44px}
.persp{perspective:1800px}
.use .persp{flex:0 0 1060px}
.devices .persp{flex:0 0 940px}
.browser{
  width:100%;height:600px;border-radius:20px;overflow:hidden;background:#0c0c12;
  box-shadow:0 70px 120px -46px #000,0 0 0 1px rgba(255,255,255,.13);will-change:transform;
}
.browser__bar{
  height:50px;display:flex;align-items:center;gap:10px;padding:0 20px;
  background:linear-gradient(#1b1b25,#101017);border-bottom:1px solid rgba(255,255,255,.07);
}
.browser__bar u{width:11px;height:11px;border-radius:50%;background:#2f2f3c;display:block}
.browser__url{
  flex:1;margin-left:14px;height:30px;border-radius:9px;background:#191922;
  display:flex;align-items:center;padding:0 16px;font-size:13px;letter-spacing:.06em;color:rgba(255,255,255,.6);
}
.browser__view{position:relative;height:550px;overflow:hidden;background:#fff}
.scroller{position:absolute;left:0;top:0;width:100%;will-change:transform}

/* ---------- plan « fonctionnalités » ---------- */
.rows{width:1560px;text-align:left}
.row{
  display:flex;align-items:baseline;gap:28px;padding:22px 0;
  border-top:1px solid rgba(255,255,255,.13);will-change:transform,opacity;
}
.row:last-child{border-bottom:1px solid rgba(255,255,255,.13)}
.row b{
  font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:.16em;
  color:var(--accent);flex:0 0 46px;
}
.row h3{margin:0;font-family:var(--font-display);font-weight:800;font-size:40px;letter-spacing:-.035em;flex:0 0 460px}
.row p{margin:0;font-size:19px;line-height:1.45;color:rgba(255,255,255,.62);flex:1}

/* ---------- plan « deux écrans » ---------- */
.devices{display:flex;align-items:center;justify-content:center;gap:56px;width:100%}
.devices .browser{height:452px}
.devices .browser__view{height:402px}
.devices .phone{width:246px;height:492px;border-radius:40px}
.devices .phone__screen{border-radius:36px}
.devices .phone__notch{width:84px;height:23px;top:17px}

/* ---------- plan « CTA » ---------- */
.cta .display{font-size:158px;text-shadow:0 6px 60px rgba(4,8,28,.45)}
.cta__url{
  margin:48px 0 0;display:inline-flex;align-items:center;gap:20px;padding:22px 44px;border-radius:999px;
  background:rgba(6,4,14,.62);border:1px solid rgba(255,255,255,.28);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  font-family:var(--font-display);font-weight:800;font-size:36px;letter-spacing:-.02em;
  box-shadow:0 40px 90px -34px rgba(0,0,0,.85);
}
.offer{display:flex;gap:20px;width:1500px}
.offer__item{
  flex:1;padding:38px 34px;border-radius:24px;text-align:left;
  border:1px solid rgba(255,255,255,.2);background:rgba(6,4,14,.5);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);will-change:transform,opacity;
}
.offer__k{font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.6);margin:0 0 16px}
.offer__v{margin:0;font-family:var(--font-display);font-weight:800;font-size:34px;letter-spacing:-.03em;overflow-wrap:anywhere}
.offer__v small{display:block;font-size:18px;font-weight:500;letter-spacing:0;color:rgba(255,255,255,.66);margin-top:10px}
.cta__note{margin-top:34px;font-size:18px;letter-spacing:.16em;color:rgba(255,255,255,.92);text-shadow:0 2px 22px rgba(4,8,28,.7)}

/* ---------- HUD persistante ---------- */
.hud{position:absolute;left:70px;right:70px;bottom:56px;z-index:50;will-change:opacity}
.tabs{display:flex;gap:12px}
.tab{
  position:relative;flex:1;height:76px;border-radius:18px;overflow:hidden;display:flex;align-items:center;gap:16px;
  padding:0 24px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.045);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:rgba(255,255,255,.5);
  transition:background-color .35s ease,border-color .35s ease,color .35s ease;
}
.tab.is-on{background:#07060c;border-color:rgba(255,255,255,.24);color:#fff}
.tab.is-done{color:rgba(255,255,255,.34)}
.tab__idx{font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:.14em;opacity:.75}
.tab__label{
  font-family:var(--font-display);font-weight:800;font-size:23px;letter-spacing:-.02em;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tab__time{margin-left:auto;font-size:14px;letter-spacing:.12em;opacity:.6}
.tab__cursor{
  position:absolute;left:0;top:0;bottom:0;width:2px;opacity:0;transform:translate3d(0,0,0);
  background:linear-gradient(180deg,rgba(255,255,255,0),#fff 18%,#fff 82%,rgba(255,255,255,0));
  box-shadow:0 0 26px 7px var(--glow);will-change:transform,opacity;
}
.tab.is-on .tab__cursor{opacity:1}
.ruler{position:relative;height:38px;margin-top:18px}
.ticks{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-between}
.ticks i{width:2px;height:9px;background:currentColor;opacity:.3;display:block}
.ticks i.t5{height:16px;opacity:.45}
.ticks i.t10{height:26px;opacity:.6}
.ticks--base{color:#fff}
.lit{position:absolute;inset:0;clip-path:inset(0 100% 0 0);will-change:clip-path}
.ticks--lit{color:var(--accent)}
.ticks--lit i{opacity:.95}
/* repères de coupe : un trait par plan */
.cuts{position:absolute;left:0;right:0;top:-4px;height:42px}
.cuts i{position:absolute;top:0;width:1px;height:42px;background:rgba(255,255,255,.32)}
.playhead{
  position:absolute;left:0;top:-8px;width:2px;height:46px;background:#fff;border-radius:2px;
  box-shadow:0 0 22px 6px var(--glow);transform:translate3d(0,0,0);will-change:transform;
}
.playhead::before{
  content:"";position:absolute;left:50%;top:-9px;width:9px;height:9px;margin-left:-4.5px;
  border-radius:50%;background:#fff;box-shadow:0 0 18px 4px var(--glow);
}

/* ---------- overlay Play / Record ---------- */
.overlay{
  position:absolute;inset:0;z-index:80;display:grid;place-items:center;
  background:radial-gradient(70% 60% at 50% 50%,rgba(6,3,14,.6),rgba(2,1,6,.94));
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);will-change:opacity;
}
.panel{
  width:760px;padding:64px;border-radius:32px;text-align:center;
  background:linear-gradient(158deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);
  box-shadow:0 80px 160px -50px rgba(0,0,0,.9);
}
.panel h2{font-family:var(--font-display);font-weight:900;font-size:56px;letter-spacing:-.045em;margin:0 0 12px}
.panel p{margin:0 0 40px;font-size:17px;letter-spacing:.06em;color:rgba(255,255,255,.6)}
.btns{display:flex;gap:16px;justify-content:center}
button{
  font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.01em;
  padding:20px 40px;border-radius:999px;border:1px solid rgba(255,255,255,.22);
  background:rgba(255,255,255,.06);color:#fff;cursor:pointer;
  transition:transform .18s ease,background-color .25s ease,border-color .25s ease;
}
button:hover{transform:translateY(-2px);background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.4)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button.primary{background:linear-gradient(150deg,#fff,#dcccff);color:#0a0416;border-color:transparent}
button.primary:hover{background:#fff}
.hints{margin-top:38px;font-size:14px;letter-spacing:.1em;color:rgba(255,255,255,.42);line-height:2}
.hints kbd{
  border:1px solid rgba(255,255,255,.22);border-radius:6px;padding:3px 9px;margin:0 3px;
  font-family:inherit;font-size:13px;color:rgba(255,255,255,.72);
}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);z-index:120;
  padding:14px 26px;border-radius:999px;background:rgba(10,6,20,.9);border:1px solid rgba(255,255,255,.18);
  font-size:14px;letter-spacing:.08em;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
body.is-recording .overlay,body.is-recording .toast{display:none}
.is-hidden-ui .hud,.is-hidden-ui .topbar{opacity:0}

/* ==========================================================================
   FORMATS VERTICAL ET CARRÉ — 9:16 (Reels, TikTok, Shorts) et 1:1.
   Tout ce qui est large se met en colonne ; rien ne change en 16:9.
   ========================================================================== */
.stage:not([data-fmt="16:9"]) .topline{display:none}
.stage:not([data-fmt="16:9"]) .topbar{height:92px;padding:0 46px}
.stage:not([data-fmt="16:9"]) .beat{padding:150px 46px 320px}
.stage:not([data-fmt="16:9"]) .display{font-size:104px}
.stage:not([data-fmt="16:9"]) .lede{font-size:30px;max-width:none}
.stage:not([data-fmt="16:9"]) .card{padding:40px;border-radius:28px}
.stage:not([data-fmt="16:9"]) .eyebrow{font-size:15px;margin-bottom:24px}

/* intro : le texte au-dessus, l'iPhone en dessous */
.stage:not([data-fmt="16:9"]) .split{flex-direction:column;width:100%;gap:36px}
.stage:not([data-fmt="16:9"]) .phone-wrap{flex:0 0 auto}
.stage:not([data-fmt="16:9"]) .phone{width:340px;height:680px;margin:0}
.stage:not([data-fmt="16:9"]) .phone__screen{border-radius:40px}

/* services : une colonne */
.stage:not([data-fmt="16:9"]) .svcs{grid-template-columns:1fr;width:100%;gap:14px}
.stage:not([data-fmt="16:9"]) .svc{padding:34px 34px;gap:26px}
.stage:not([data-fmt="16:9"]) .svc h3{font-size:38px}
.stage:not([data-fmt="16:9"]) .ico-box{width:54px;height:54px}

/* étapes : icône à gauche, période et titre à droite */
.stage:not([data-fmt="16:9"]) .steps{flex-direction:column;width:100%;gap:18px}
.stage:not([data-fmt="16:9"]) .step{
  display:grid;grid-template-columns:auto 1fr;column-gap:22px;align-items:center;padding-top:18px;
}
.stage:not([data-fmt="16:9"]) .step .ico-box{grid-row:1/3;margin:0;width:50px;height:50px}
.stage:not([data-fmt="16:9"]) .step b{align-self:end}
.stage:not([data-fmt="16:9"]) .step h3{margin:2px 0 0;font-size:40px;align-self:start}

/* toujours inclus : grille 2 × 3 */
.stage:not([data-fmt="16:9"]) .incl{display:grid;grid-template-columns:repeat(2,1fr);gap:38px 0;width:100%}
.stage:not([data-fmt="16:9"]) .incl__i{border-left:0;padding:0 12px}
.stage:not([data-fmt="16:9"]) .incl .ico-box{width:66px;height:66px}
.stage:not([data-fmt="16:9"]) .incl__i span{font-size:27px}

/* chiffres : empilés, icône à gauche */
.stage:not([data-fmt="16:9"]) .stats{flex-direction:column;width:100%;gap:14px}
.stage:not([data-fmt="16:9"]) .stat{
  display:grid;grid-template-columns:auto 1fr;column-gap:28px;align-items:center;padding:34px 34px;
}
.stage:not([data-fmt="16:9"]) .stat .ico-box{grid-row:1/3;margin:0;width:40px;height:40px}
.stage:not([data-fmt="16:9"]) .stat__num{font-size:92px}
.stage:not([data-fmt="16:9"]) .stat__num small{font-size:32px}
.stage:not([data-fmt="16:9"]) .stat__lab{margin:6px 0 0;font-size:17px}

/* navigateur : titre au-dessus, écran en dessous */
.stage:not([data-fmt="16:9"]) .use{flex-direction:column;width:100%;gap:30px;padding:36px}
.stage:not([data-fmt="16:9"]) .use .col{order:1;width:100%}
.stage:not([data-fmt="16:9"]) .use .persp{order:2;flex:0 0 auto;width:100%}
.stage:not([data-fmt="16:9"]) .use .display{font-size:64px}
.stage:not([data-fmt="16:9"]) .browser{height:560px}
.stage:not([data-fmt="16:9"]) .browser__view{height:510px}
.stage:not([data-fmt="16:9"]) .points{justify-content:flex-start}

/* deux écrans : l'un sous l'autre */
.stage:not([data-fmt="16:9"]) .devices{flex-direction:column;gap:26px}
.stage:not([data-fmt="16:9"]) .devices .persp{flex:0 0 auto;width:100%}
.stage:not([data-fmt="16:9"]) .devices .browser{height:440px}
.stage:not([data-fmt="16:9"]) .devices .browser__view{height:390px}
.stage:not([data-fmt="16:9"]) .devices .phone{width:260px;height:520px}
.stage:not([data-fmt="16:9"]) .devices .phone__screen{border-radius:34px}

/* contact */
.stage:not([data-fmt="16:9"]) .offer{flex-direction:column;width:100%;gap:14px}
.stage:not([data-fmt="16:9"]) .offer__item{padding:28px 30px}
.stage:not([data-fmt="16:9"]) .cta .display{font-size:92px}
.stage:not([data-fmt="16:9"]) .cta__url{font-size:30px;padding:18px 34px;margin-top:34px}
.stage:not([data-fmt="16:9"]) .cta__note{font-size:16px}
.stage:not([data-fmt="16:9"]) .lockup__name{font-size:74px}
.stage:not([data-fmt="16:9"]) .logomark{width:112px;height:112px;font-size:42px}

/* HUD compacte */
.stage[data-fmt="9:16"] .hud{left:46px;right:46px;bottom:250px}
.stage[data-fmt="9:16"] .beat{padding:190px 46px 470px}
.stage[data-fmt="1:1"] .hud{left:46px;right:46px;bottom:64px}
.stage:not([data-fmt="16:9"]) .tab{height:62px;padding:0 14px;gap:10px;border-radius:14px}
.stage:not([data-fmt="16:9"]) .tab__label{font-size:16px}
.stage:not([data-fmt="16:9"]) .tab__time{display:none}
.stage:not([data-fmt="16:9"]) .tab__ico{width:20px;height:20px}
.stage:not([data-fmt="16:9"]) .tab__idx{font-size:12px}
.stage:not([data-fmt="16:9"]) .ruler{height:30px;margin-top:14px}

/* le carré : moins de hauteur que le vertical, tout est resserré */
.stage[data-fmt="1:1"] .beat{padding:116px 44px 236px}
.stage[data-fmt="1:1"] .display{font-size:76px}
.stage[data-fmt="1:1"] .lede{font-size:25px}
.stage[data-fmt="1:1"] .eyebrow{margin-bottom:18px}
.stage[data-fmt="1:1"] .card{padding:32px}
.stage[data-fmt="1:1"] .split{gap:26px}
.stage[data-fmt="1:1"] .phone{width:214px;height:428px;border-radius:38px}
.stage[data-fmt="1:1"] .phone__screen{border-radius:30px}
.stage[data-fmt="1:1"] .browser{height:330px}
.stage[data-fmt="1:1"] .browser__view{height:280px}
.stage[data-fmt="1:1"] .use{gap:22px;padding:28px}
.stage[data-fmt="1:1"] .use .display{font-size:52px}
.stage[data-fmt="1:1"] .devices{gap:18px}
.stage[data-fmt="1:1"] .devices .browser{height:224px}
.stage[data-fmt="1:1"] .devices .browser__view{height:174px}
.stage[data-fmt="1:1"] .devices .phone{width:146px;height:292px;border-radius:26px}
.stage[data-fmt="1:1"] .devices .phone__screen{border-radius:22px}
.stage[data-fmt="1:1"] .devices .phone__notch{width:60px;height:17px;top:12px}
.stage[data-fmt="1:1"] .stat{padding:22px 26px}
.stage[data-fmt="1:1"] .stat__num{font-size:62px}
.stage[data-fmt="1:1"] .stat__lab{font-size:15px}
.stage[data-fmt="1:1"] .stats{gap:10px}
.stage[data-fmt="1:1"] .incl{gap:24px 0}
.stage[data-fmt="1:1"] .incl .ico-box{width:44px;height:44px}
.stage[data-fmt="1:1"] .incl__i{gap:12px}
.stage[data-fmt="1:1"] .incl__i span{font-size:20px}
.stage[data-fmt="1:1"] .svcs{gap:10px}
.stage[data-fmt="1:1"] .svc{padding:18px 24px;gap:18px}
.stage[data-fmt="1:1"] .svc h3{font-size:27px}
.stage[data-fmt="1:1"] .ico-box{width:40px;height:40px}
.stage[data-fmt="1:1"] .steps{gap:10px}
.stage[data-fmt="1:1"] .step{padding-top:12px}
.stage[data-fmt="1:1"] .step h3{font-size:30px}
.stage[data-fmt="1:1"] .step .ico-box{width:36px;height:36px}
.stage[data-fmt="1:1"] .offer{gap:8px}
.stage[data-fmt="1:1"] .offer__item{padding:13px 20px}
.stage[data-fmt="1:1"] .offer__v{font-size:26px!important}
.stage[data-fmt="1:1"] .offer__v small{font-size:15px;margin-top:3px}
.stage[data-fmt="1:1"] .offer__item .ico-box{width:24px;height:24px;margin-bottom:10px}
.stage[data-fmt="1:1"] .cta .display{font-size:52px}
.stage[data-fmt="1:1"] .cta__url{font-size:23px;padding:11px 24px;margin:16px auto 30px!important}
.stage[data-fmt="1:1"] .offer__k{margin-bottom:5px;font-size:12px}
.stage[data-fmt="1:1"] .cta__note{margin-top:16px;font-size:13px}
.stage[data-fmt="1:1"] .lockup__name{font-size:62px}
.stage[data-fmt="1:1"] .logomark{width:96px;height:96px;font-size:36px;border-radius:28px}
.stage[data-fmt="1:1"] .points{margin-top:22px;gap:12px 20px}
.stage[data-fmt="1:1"] .point{font-size:19px}

/* ==========================================================================
   Version pleine image : sans onglets ni réglette, la composition se
   recentre verticalement.
   ========================================================================== */
.stage.no-hud .hud{display:none}
.stage.no-hud .beat{padding:150px 90px 150px}
.stage.no-hud[data-fmt="9:16"] .beat{padding:240px 46px 300px}
.stage.no-hud[data-fmt="1:1"] .beat{padding:150px 44px 150px}

@media (prefers-reduced-motion:reduce){
  .ticker__row{transform:none!important}
}

<body>
<div id="viewport">
  <div class="stage" id="stage">
    <div class="layer bg-violet"></div>
    <div class="layer bg-sky" id="sky"></div>
    <canvas id="gl" width="1920" height="1080"></canvas>
    <div class="layer vignette"></div>
    <div class="layer grain" id="grain"></div>
    <div class="layer scrim"></div>

    <div class="topbar" id="topbar">
      <div class="bug">
        <span class="bug__mark" id="bugMark"></span>
        <span class="bug__name" id="bugName"></span>
        <span class="bug__dot"></span>
      </div>
      <p class="topline" id="topline"></p>
    </div>

    <div class="chapters" id="chapters"></div>

    <div class="iris-ring" id="ring"></div>

    <div class="hud" id="hud">
      <div class="tabs" id="tabs"></div>
      <div class="ruler">
        <div class="ticks ticks--base" id="ticksBase"></div>
        <div class="lit" id="lit"><div class="ticks ticks--lit" id="ticksLit"></div></div>
        <div class="cuts" id="cuts"></div>
        <div class="playhead" id="playhead"></div>
      </div>
    </div>

    <div class="layer flash" id="flash"></div>
    <div class="layer blackout" id="blackout"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="panel">
      <h2 id="ovTitle">Promo Engine</h2>
      <p id="ovMeta">1920 × 1080 · 45 s · boucle</p>
      <div class="btns">
        <button class="primary" id="btnPlay">▶ Play</button>
        <button id="btnRec">● Record</button>
      </div>
      <div class="hints">
        <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> aller au chapitre · <kbd>espace</kbd> play / pause<br>
        <kbd>C</kbd> durée 15 s / 45 s · <kbd>F</kbd> format · <kbd>R</kbd> enregistrer<br>
        <kbd>H</kbd> interface · <kbd>M</kbd> son · <kbd>S</kbd> effets · <kbd>0</kbd> début
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

let CH = [], BEATS = [], TOTAL = 0, CUT = 'long';
const mmss = t => Math.floor(t / 60) + ':' + String(Math.round(t % 60)).padStart(2, '0');

function sliceMontage(name) {
  const cuts = CONFIG.cuts || {};
  CUT = cuts[name] ? name : Object.keys(cuts)[0];
  CH = (cuts[CUT].chapters || []).map(c => Object.assign({}, c));
  BEATS = [];
  let acc = 0;
  CH.forEach((c, ci) => {
    c.start = acc;
    let off = 0;
    c.beats = c.beats.map((b, bi) => {
      const beat = Object.assign({}, b, { ci, bi, dur: b.t, start: acc + off, first: bi === 0 });
      off += b.t;
      BEATS.push(beat);
      return beat;
    });
    c.dur = off;
    acc += off;
  });
  TOTAL = acc;
  BEATS.forEach((b, i) => { b.last = i === BEATS.length - 1; b.tail = b.last ? 0 : .18; });
  $('#ovMeta').textContent = TOTAL.toFixed(0) + ' s · ' + BEATS.length + ' plans · boucle · 16:9, 9:16, 1:1';
}

function fillScreen(hostEl, url, kind) {

  }
  hostEl.appendChild(box);
  return box;

      setTimeout(() => { h.__travel = Math.max(0, box.scrollHeight - h.clientHeight); }, 600);
    });
  });
}

function localCenter(node) {
  let x = 0, y = 0, n = node;
  while (n && n !== stage) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
  return [IRIS_X - x, IRIS_Y - y];
}

/* Styles de coupe : chaque plan entre depuis une direction, et le plan
   précédent sort dans cette même direction — le mouvement se poursuit d'un
   plan à l'autre au lieu de deux fondus qui se croisent. */
const CUTS = {
  iris: { x:   0, y:  26, s: 1.03 },
  up:   { x:   0, y:  70, s: 1.00 },
  side: { x:  90, y:   0, s: 1.00 },
  back: { x: -90, y:   0, s: 1.00 },
  zoom: { x:   0, y:   0, s: 1.09 }
};
const CUT_CYCLE = ['up', 'side', 'zoom', 'back'];
BEATS.forEach((b, i) => { b.cut = b.first ? 'iris' : (b.cut || CUT_CYCLE[i % CUT_CYCLE.length]); });

function beatTimeline(b) {
  const root = b.el, dur = b.dur;
  const card    = $('[data-card]', root);
  const items   = el('[data-in]', root);
  const chips   = el('[data-chip]', root);
  const stats   = el('[data-stat]', root);
  const rows    = el('[data-row]', root);
  const lines   = el('.mask i', root);
  const phone   = $('[data-phone]', root);
  const browser = $('[data-browser]', root);
  const tl = gsap.timeline();

  /* ouverture de chapitre : masque circulaire + anneau. Sinon : coupe franche. */
  if (b.first) {
    const irises = el('[data-iris]', root);
    const iris = { r: 0 };
    tl.fromTo(iris, { r: 0 }, {
      r: 1500, duration: 1.0, ease: 'power2.inOut',
      onStart() { irises.forEach(n => { n.__c = localCenter(n); }); },
      onUpdate() {
        const r = iris.r.toFixed(0) + 'px';
        for (const n of irises) {
          if (!n.__c) n.__c = localCenter(n);
          n.style.clipPath = 'circle(' + r + ' at ' + n.__c[0] + 'px ' + n.__c[1] + 'px)';
        }
      },
      onComplete() { irises.forEach(n => { n.style.clipPath = 'none'; }); }
    }, 0);
    tl.fromTo(ring, { scale: .05, opacity: .95 }, { scale: 16, opacity: 0, duration: 1.1, ease: 'power2.inOut' }, 0);
  }

  const E = CUTS[b.cut] || CUTS.up;
  const nx = BEATS[BEATS.indexOf(b) + 1];
  const X = (nx && CUTS[nx.cut]) || CUTS.zoom;
  const dir = b.cut === 'side' ? 1 : (b.cut === 'back' ? -1 : 0);

  /* son : souffle sur la coupe, impact sur l'ouverture de chapitre */
  tl.call(fx, ['whoosh', dir, b.first ? .7 : .45], 0);
  if (b.first) tl.call(fx, ['impact'], 0);
  /* montée annonçant le chapitre suivant */
  if (nx && nx.first) tl.call(fx, ['riser', .8], dur - .8);

  tl.fromTo(card,
    { x: E.x, y: E.y, scale: E.s, opacity: 0 },
    { x: 0, y: 0, scale: 1, opacity: 1, duration: b.first ? 1.0 : .62, ease: 'expo.out' }, 0);

  if (items.length) {
    tl.fromTo(items, { x: E.x ? E.x * .45 : 0, y: E.x ? 0 : 28, opacity: 0 },
      { x: 0, y: 0, opacity: 1, duration: .6, stagger: .05, ease: 'expo.out' }, .08);
    items.slice(0, 5).forEach((_, k) => tl.call(fx, ['click', k, .14], .09 + k * .05));
  }
  if (lines.length) tl.fromTo(lines, { yPercent: 118, rotate: 2 },
    { yPercent: 0, rotate: 0, duration: .85, stagger: .1, ease: 'expo.out' }, .1);
  if (chips.length) tl.fromTo(chips, { y: 24, scale: .93, opacity: 0 },
    { y: 0, scale: 1, opacity: 1, duration: .5, stagger: .045, ease: 'back.out(1.7)' }, .16);
  if (stats.length) {
    tl.fromTo(stats, { y: 46, opacity: 0 },
      { y: 0, opacity: 1, duration: .7, stagger: .1, ease: 'expo.out' }, .12);
    stats.forEach((_, k) => tl.call(fx, ['click', k + 2, .2], .13 + k * .1));
  }
  if (rows.length) tl.fromTo(rows, { y: 32, opacity: 0 },
    { y: 0, opacity: 1, duration: .55, stagger: .08, ease: 'expo.out' }, .14);

  /* compteurs chiffrés */
  el('[data-count]', root).forEach((n, k) => {
    const to = parseFloat(n.dataset.count), dec = +n.dataset.dec || 0;
    const o = { v: 0 };
    const cd = Math.min(1.5, dur * .5);
    tl.fromTo(o, { v: 0 }, {
      v: to, duration: cd, ease: 'power2.out',
      onUpdate() { n.textContent = o.v.toFixed(dec).replace('.', ','); }
    }, .2 + k * .1);
    if (k === 0) tl.call(fx, ['count', cd], .2);
  });

  if (phone) {
    tl.fromTo(phone, { yPercent: 32, rotateX: 22, opacity: 0 },
      { yPercent: 0, rotateX: 0, opacity: 1, duration: 1.25, ease: 'expo.out' }, .18);
    tl.call(fx, ['whoosh', 0, .55, ], .16);
  }
  if (browser) tl.fromTo(browser, { yPercent: 3, rotateY: -9, scale: .975, opacity: 0 },
    { yPercent: 0, rotateY: 0, scale: 1, opacity: 1, duration: 1.05, ease: 'expo.out' }, .08);

  el('[data-screen]', root).forEach(s => {
    const cap = s.dataset.screen === 'mobile' ? 760 : 1500;
    const sd = Math.max(1.2, dur - .9);
    tl.to(s.__scroller, {
      y: () => -Math.min(s.__travel, cap), duration: sd,
      ease: 'power1.inOut', immediateRender: false
    }, .45);
    if (s.dataset.screen === 'desktop') tl.call(fx, ['scroll', sd], .5);
  });

  if (b.type === 'offer') tl.call(fx, ['confirm'], .45);

  /* Sortie : fondu court et rectiligne, qui déborde de 0,15 s sur le plan
     suivant. Assez long pour qu'aucune image ne soit vide à l'instant de la
     coupe, assez rapide pour qu'on ne lise jamais deux textes à la fois. */
  tl.to(card, {
    x: -X.x * .5, y: -X.y * .45, scale: X.s > 1 ? .985 : 1, opacity: 0,
    duration: b.last ? .5 : .45, ease: b.last ? 'power2.in' : 'power1.in'
  }, dur - (b.last ? .5 : .30));
  return tl;
}

const veils = [$('.vignette'), $('.scrim')];
const blackout = $('#blackout');
let master = null;

function buildTimeline() {
  master = gsap.timeline({ paused: true, repeat: -1, onUpdate: sync });
  BEATS.forEach(b => master.add(beatTimeline(b), b.start));

  /* ciel du dernier chapitre + voiles ouverts pendant le CTA */
  const lastCh = CH[CH.length - 1];
  master.fromTo(sky, { opacity: 0 }, { opacity: 1, duration: 1.4, ease: 'power2.inOut', immediateRender: false }, lastCh.start);
  master.fromTo(veils, { opacity: 1 }, { opacity: .3, duration: 1.4, ease: 'power2.inOut', immediateRender: false }, lastCh.start);
  master.to(sky,   { opacity: 0, duration: 1.0, ease: 'power2.in' }, TOTAL - 1.05);
  master.to(veils, { opacity: 1, duration: 1.0, ease: 'power2.in' }, TOTAL - 1.05);

  /* éclats blancs sur les coupes marquées */
  BEATS.filter(b => b.flash).forEach(b => {
    master.fromTo(flash, { opacity: 0 }, { opacity: .16, duration: .06, ease: 'none', immediateRender: false }, b.start)
          .to(flash, { opacity: 0, duration: .22, ease: 'power2.out' }, b.start + .06);
  });

  /* raccord de boucle */
  master.fromTo(blackout, { opacity: 1 }, { opacity: 0, duration: .8, ease: 'power2.out', immediateRender: false }, 0);
  master.to(blackout, { opacity: 1, duration: .6, ease: 'power2.in' }, TOTAL - .6);
}

/* Change de montage : 15 s ou 45 s, sans recharger la page. */
function buildMontage(name) {
  const wasPlaying = master && !master.paused();
  seeking = true;
  if (master) { master.pause(); master.kill(); }
  gsap.set([sky, blackout, flash], { clearProps: 'opacity' });
  gsap.set(veils, { opacity: 1 });
  sliceMontage(name);
  buildDOM();
  buildHUD();
  buildTimeline();
  curCh = -1; curBeat = -1;
  measureHUD();
  master.time(0, false);
  sync();
  requestAnimationFrame(() => {
    measureScreens();
    master.invalidate();
    sync();
    seeking = false;
    if (wasPlaying) { master.play(); AUDIO.play(0); }
  });
}

/* ==========================================================================
   Synchronisation HUD + décor (quelques écritures de style par image)
   ========================================================================== */
let curCh = -1, curBeat = -1;
let tabW = 1, rulerW = 1;
let seeking = false;
function measureHUD() {
  tabW   = TABS[0] ? TABS[0].getBoundingClientRect().width / _scale : 1;
  rulerW = $('.ruler').getBoundingClientRect().width / _scale || 1;
}

function setChapter(i) {
  if (i === curCh) return;
  curCh = i;
  TABS.forEach((t, k) => {
    t.classList.toggle('is-on', k === i);
    t.classList.toggle('is-done', k < i);
  });
  if (PROMO.scene) PROMO.scene.chapter(i);
}

function indexAt(t) {
  for (let i = CH.length - 1; i >= 0; i--) if (t >= CH[i].start) return i;
  return 0;
}
function beatAt(t) {
  for (let i = BEATS.length - 1; i >= 0; i--) if (t >= BEATS[i].start) return i;
  return 0;
}

function sync() {
  if (!master) return;
  const t = master.time();

  /* visibilité des plans : le plan sortant reste affiché le temps du chevauchement */
  for (const b of BEATS) {
    const v = (t >= b.start && t < b.start + b.dur + b.tail) ? 'visible' : 'hidden';
    if (b.v !== v) { b.v = v; b.el.style.visibility = v; }
  }

  const bi = beatAt(t);
  if (bi !== curBeat) curBeat = bi;

  const i = indexAt(t);
  setChapter(i);

  const c = CH[i];
  const p = Math.min(1, Math.max(0, (t - c.start) / c.dur));
  TABS[i].lastElementChild.style.transform = 'translate3d(' + (p * tabW).toFixed(1) + 'px,0,0)';
  const gp = t / TOTAL;
  playhead.style.transform = 'translate3d(' + (gp * rulerW).toFixed(1) + 'px,0,0)';
  lit.style.clipPath = 'inset(0 ' + ((1 - gp) * 100).toFixed(2) + '% 0 0)';

  AUDIO.tick(t);
}

/* ---------- format de sortie et mise à l'échelle ---------- */
let _scale = 1, STAGE_W = 1920, STAGE_H = 1080;
let FORMAT = '16:9';

function measureScreens() {
  el('[data-screen]').forEach(h => {
    if (h.__scroller) h.__travel = Math.max(0, h.__scroller.scrollHeight - h.clientHeight);
  });
}

function applyFormat(f) {
  const map = CONFIG.formats || {};
  const size = map[f] || map['16:9'] || [1920, 1080];
  FORMAT = map[f] ? f : '16:9';
  STAGE_W = size[0]; STAGE_H = size[1];
  stage.dataset.fmt = FORMAT;
  stage.style.width  = STAGE_W + 'px';
  stage.style.height = STAGE_H + 'px';
  IRIS_X = STAGE_W / 2;
  IRIS_Y = STAGE_H * .5;
  el('[data-iris]').forEach(n => { n.__c = null; n.style.clipPath = 'none'; });
  fit();
  if (PROMO.scene) PROMO.scene.resize(STAGE_W, STAGE_H);
  requestAnimationFrame(() => {
    measureScreens();
    master.invalidate();   // les courses de défilement dépendent du format
    sync();
  });
}

function fit() {
  _scale = Math.min(innerWidth / STAGE_W, innerHeight / STAGE_H);
  stage.style.transform = 'translate(-50%,-50%) scale(' + _scale + ')';
  measureHUD();
}
addEventListener('resize', fit);

/* ==========================================================================
   Son : une piste de musique calée sur la timeline, mixée directement dans
   l'enregistrement via Web Audio (pas de « partager l'audio » à cocher).
   ========================================================================== */
const AK = CONFIG.audio || {};

const AUDIO = {
  on: true, ready: false, mixed: false,
  ctx: null, dest: null, master: null, gain: null, music: null,

  /* créé au premier geste de l'utilisateur (politique d'autoplay) */
  init() {
    if (this.ready) return;
    this.ready = true;
    const AC = window.AudioContext || window.webkitAudioContext;
    try {
      this.ctx = new AC();
      this.dest = this.ctx.createMediaStreamDestination();
      this.master = this.ctx.createGain();
      this.master.connect(this.ctx.destination);
      this.master.connect(this.dest);
      this.gain = this.ctx.createGain();
      this.gain.gain.value = 0;
      this.gain.connect(this.master);
    } catch (e) { this.ctx = null; }

    if (!AK.music) return;
    this.music = new Audio(AK.music);
    this.music.crossOrigin = 'anonymous';
    this.music.loop = true;
    this.music.preload = 'auto';
    if (this.ctx && this.gain) {
      /* en cas d'échec CORS on garde la lecture, seul le mixage est perdu */
      try { this.ctx.createMediaElementSource(this.music).connect(this.gain); this.mixed = true; }
      catch (e) { this.music.volume = AK.volume == null ? .55 : AK.volume; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },

  hasMix() { return this.mixed && !!this.dest; },
  stream()  { return this.dest ? this.dest.stream : null; },

  play(t) {
    this.init();
    if (!this.music) return;
    this.sync(t, true);
    this.music.play().catch(() => {});
  },
  pause() { if (this.music) this.music.pause(); },
  sync(t, force) {
    const m = this.music;
    if (!m || !m.duration || !isFinite(m.duration)) return;
    const want = t % m.duration;
    if (force || Math.abs(m.currentTime - want) > .35) m.currentTime = want;
  },

  /* appelé à chaque image : recalage et enveloppe de volume */
  tick(t) {
    if (!this.ready || !this.music) return;
    this.sync(t, false);
    const fi = AK.fadeIn || 0, fo = AK.fadeOut || 0;
    let env = 1;
    if (fi && t < fi) env = t / fi;
    else if (fo && t > TOTAL - fo) env = Math.max(0, (TOTAL - t) / fo);
    const vol = this.on ? (AK.volume == null ? .55 : AK.volume) * env : 0;
    if (this.gain && this.ctx) this.gain.gain.setTargetAtTime(vol, this.ctx.currentTime, .12);
    else this.music.volume = Math.max(0, Math.min(1, vol));
  },

  mute() {
    this.on = !this.on;
    if (this.master && this.ctx) this.master.gain.setTargetAtTime(this.on ? 1 : 0, this.ctx.currentTime, .08);
    return this.on;
  }
};

/* ==========================================================================
   Effets sonores — synthétisés en Web Audio, aucun fichier à fournir.
   Souffle de transition (panoramique dans le sens de la coupe), clic à
   chaque apparition, texture de défilement, impact d'ouverture de chapitre.
   Tout passe par le même bus que la musique : c'est donc dans l'export.
   ========================================================================== */
const SFX = {
  on: (CONFIG.audio && CONFIG.audio.sfx > 0),
  vol: (CONFIG.audio && CONFIG.audio.sfx != null) ? CONFIG.audio.sfx : .5,
  _noise: null,

  ready() { return !!(AUDIO.ctx && AUDIO.master && this.on && this.vol > 0); },
  noise() {
    if (this._noise) return this._noise;
    const ctx = AUDIO.ctx, n = Math.floor(ctx.sampleRate * 1.2);
    const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    this._noise = b;
    return b;
  },
  src() {
    const s = AUDIO.ctx.createBufferSource();
    s.buffer = this.noise(); s.loop = true;
    return s;
  },
  out(node, pan) {
    if (pan != null && AUDIO.ctx.createStereoPanner) {
      const p = AUDIO.ctx.createStereoPanner();
      p.pan.value = pan;
      node.connect(p).connect(AUDIO.master);
      return p;
    }
    node.connect(AUDIO.master);
    return null;
  },

  /* souffle d'aspiration : bruit filtré qui balaie le spectre et l'espace */
  whoosh(dir = 0, dur = .5, peak = .55) {
    if (!this.ready()) return;
    const ctx = AUDIO.ctx, t = ctx.currentTime;
    const src = this.src();
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 1.2;
    const up = dir >= 0;
    bp.frequency.setValueAtTime(up ? 380 : 2600, t);
    bp.frequency.exponentialRampToValueAtTime(up ? 2900 : 360, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(peak * this.vol, t + dur * .38);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(bp).connect(g);
    const p = this.out(g, dir ? -dir * .55 : 0);
    if (p) p.pan.linearRampToValueAtTime(dir ? dir * .55 : 0, t + dur);
    src.start(t); src.stop(t + dur + .06);
  },

  /* clic sec : chaque élément qui apparaît */
  click(k = 0, gain = .18) {
    if (!this.ready()) return;
    const ctx = AUDIO.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(760 + k * 55, t);
    o.frequency.exponentialRampToValueAtTime(240, t + .07);
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(gain * this.vol, t + .004);
    g.gain.exponentialRampToValueAtTime(.0001, t + .10);
    o.connect(g);
    this.out(g, ((k % 3) - 1) * .25);
    o.start(t); o.stop(t + .12);
  },

  /* impact grave : ouverture de chapitre */
  impact() {
    if (!this.ready()) return;
    const ctx = AUDIO.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(130, t);
    o.frequency.exponentialRampToValueAtTime(42, t + .5);
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.6 * this.vol, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + .6);
    o.connect(g); this.out(g, 0);
    o.start(t); o.stop(t + .65);

    const src = this.src();
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(600, t);
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(.35 * this.vol, t);
    gn.gain.exponentialRampToValueAtTime(.0001, t + .22);
    src.connect(lp).connect(gn); this.out(gn, 0);
    src.start(t); src.stop(t + .28);
  },

  /* montée avant l'ouverture du chapitre */
  riser(dur = .8) {
    if (!this.ready()) return;
    const ctx = AUDIO.ctx, t = ctx.currentTime;
    const src = this.src();
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.setValueAtTime(260, t);
    hp.frequency.exponentialRampToValueAtTime(5200, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.3 * this.vol, t + dur * .85);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(hp).connect(g); this.out(g, 0);
    src.start(t); src.stop(t + dur + .05);
  },

  /* texture de défilement : la page qui file dans la maquette */
  scroll(dur = 3) {
    if (!this.ready()) return;
    const ctx = AUDIO.ctx, t0 = ctx.currentTime;
    const step = .09, n = Math.min(48, Math.floor(dur / step));
    for (let i = 0; i < n; i++) {
      const t = t0 + i * step + Math.random() * .012;
      const o = ctx.createOscillator();
      o.type = 'square';
      o.frequency.setValueAtTime(2200 + Math.random() * 900, t);
      const g = ctx.createGain();
      /* fondu aux deux bouts pour que la texture ne démarre pas net */
      const edge = Math.min(1, Math.min(i, n - i) / 6);
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.035 * this.vol * edge + .0001, t + .002);
      g.gain.exponentialRampToValueAtTime(.0001, t + .03);
      o.connect(g); g.connect(AUDIO.master);
      o.start(t); o.stop(t + .04);
    }
  },

  /* les chiffres qui défilent */
  count(dur = 1.2) {
    if (!this.ready()) return;
    const ctx = AUDIO.ctx, t0 = ctx.currentTime;
    const n = 10;
    for (let i = 0; i < n; i++) {
      const t = t0 + (i / n) * dur;
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(900 + i * 90, t);
      const g = ctx.createGain();
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.06 * this.vol, t + .003);
      g.gain.exponentialRampToValueAtTime(.0001, t + .06);
      o.connect(g); g.connect(AUDIO.master);
      o.start(t); o.stop(t + .07);
    }
  },

  /* accord final sur le plan de contact */
  confirm() {
    if (!this.ready()) return;
    const ctx = AUDIO.ctx, t = ctx.currentTime;
    [523.25, 784, 1046.5].forEach((f, i) => {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(f, t + i * .07);
      const g = ctx.createGain();
      g.gain.setValueAtTime(.0001, t + i * .07);
      g.gain.exponentialRampToValueAtTime(.16 * this.vol, t + i * .07 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + i * .07 + .7);
      o.connect(g); g.connect(AUDIO.master);
      o.start(t + i * .07); o.stop(t + i * .07 + .75);
    });
  }
};

/* Déclencheur : rien ne sonne pendant un saut de lecture ni à l'arrêt. */
function fx(name, a, b2) {
  if (seeking || !SFX.on) return;
  if (master.paused() && !PROMO.render) return;
  const f = SFX[name];
  if (f) f.call(SFX, a, b2);
}

/* ==========================================================================
   Commandes
   ========================================================================== */
const overlay = $('#overlay'), toastEl = $('#toast');
let toastT;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('is-on');
  clearTimeout(toastT);
  toastT = setTimeout(() => toastEl.classList.remove('is-on'), 2600);
}
const hideOverlay = () => gsap.to(overlay, { autoAlpha: 0, duration: .45, ease: 'power2.out' });

function unseek() { requestAnimationFrame(() => { seeking = false; }); }

function start(from = 0) {
  hideOverlay(); clearIris(); seeking = true;
  master.pause(); master.time(from, false); master.play();
  AUDIO.play(from);
  sync(); unseek();
}
function goto(i) {
  hideOverlay(); clearIris(); seeking = true;
  master.time(CH[i].start + .001, false);
  if (master.paused()) master.play();
  AUDIO.play(CH[i].start);
  sync(); unseek();
}
function toggle() {
  if (master.paused() || !master.isActive()) { hideOverlay(); master.play(); AUDIO.play(master.time()); }
  else { master.pause(); AUDIO.pause(); }
}

$('#btnPlay').addEventListener('click', () => { AUDIO.init(); start(0); });
$('#btnRec').addEventListener('click', record);

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k >= '1' && k <= String(Math.min(9, CH.length))) { goto(+k - 1); e.preventDefault(); return; }
  if (k === '0') { start(0); e.preventDefault(); return; }
  if (k === ' ') { toggle(); e.preventDefault(); return; }
  if (k === 'r') { record(); return; }
  if (k === 'h') { stage.classList.toggle('no-hud'); measureHUD(); return; }
  if (k === 'm') { toast(AUDIO.mute() ? 'Son activé' : 'Son coupé'); return; }
  if (k === 's') {
    SFX.on = !SFX.on;
    toast(SFX.on ? 'Effets sonores activés' : 'Effets sonores coupés');
    return;
  }
  if (k === 'c') {
    const keys = Object.keys(CONFIG.cuts || {});
    buildMontage(keys[(keys.indexOf(CUT) + 1) % keys.length]);
    toast('Montage ' + CUT + ' — ' + TOTAL.toFixed(0) + ' s');
    return;
  }
  if (k === 'f') {
    const keys = Object.keys(CONFIG.formats || { '16:9': 1 });
    applyFormat(keys[(keys.indexOf(FORMAT) + 1) % keys.length]);
    toast('Format ' + FORMAT + ' — ' + STAGE_W + ' × ' + STAGE_H);
  }
});

/* ==========================================================================
   Enregistrement : capture d'onglet → WebM, arrêt en fin de boucle
   ========================================================================== */
let recorder = null;
async function record() {
  if (recorder) { recorder.stop(); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    toast("Capture non supportée ici — utilisez un enregistreur d'écran.");
    return;
  }
  AUDIO.init();
  const mix = AUDIO.hasMix() ? AUDIO.stream() : null;

  let stream;
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: { ideal: 60, max: 60 }, width: STAGE_W, height: STAGE_H },
      /* sans graphe mixable, on retombe sur l'audio de l'onglet
         (cocher « partager l'audio » dans la fenêtre de partage) */
      audio: !mix, preferCurrentTab: true
    });
  } catch (err) { toast('Capture annulée.'); return; }

  /* la vidéo vient de la capture, le son du graphe Web Audio : pas de
     micro, pas de bruit système, pas de case à cocher */
  const tracks = [...stream.getVideoTracks(),
                  ...((mix ? mix : stream).getAudioTracks())];
  const capture = new MediaStream(tracks);

  /* MP4 d'abord : c'est ce qu'Instagram, TikTok et YouTube recompressent le
     mieux. Repli automatique en WebM si le navigateur ne sait pas encoder. */
  const wantMp4 = (CONFIG.record.format || 'mp4') === 'mp4';
  const candidates = [
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4;codecs=avc1.4d002a,mp4a.40.2',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ].filter(m => wantMp4 || !m.startsWith('video/mp4'));
  const mime = candidates.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
  const isMp4 = mime.startsWith('video/mp4');
  const ext = isMp4 ? 'mp4' : 'webm';
  const base = (CONFIG.record.filename || 'promo').replace(/\.(mp4|webm)$/i, '');
  const name = `${base}-${TOTAL.toFixed(0)}s-${STAGE_W}x${STAGE_H}.${ext}`;

  const chunks = [];
  recorder = new MediaRecorder(capture, { mimeType: mime || undefined, videoBitsPerSecond: CONFIG.record.bitrate });
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onerror = e => { toast('Erreur d\'enregistrement : ' + (e.error && e.error.name || 'inconnue')); };
  recorder.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    document.body.classList.remove('is-recording');
    recorder = null;
    if (!chunks.length) { toast('Aucune image capturée — relancez la capture.'); return; }
    const blob = new Blob(chunks, { type: mime.split(';')[0] || 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 8000);
    toast(name + ' — ' + (blob.size / 1048576).toFixed(1) + ' Mo'
          + (isMp4 ? '' : ' · MP4 non supporté ici, fichier WebM'));
  };
  stream.getVideoTracks()[0].addEventListener('ended', () => {
    if (recorder && recorder.state !== 'inactive') recorder.stop();
  });

  document.body.classList.add('is-recording');
  hideOverlay();
  recorder.start(200);
  const r = CONFIG.record;
  setTimeout(() => start(0), r.lead * 1000);
  setTimeout(() => { if (recorder && recorder.state !== 'inactive') recorder.stop(); },
             (r.lead + TOTAL * r.loops + r.tail) * 1000);
}

/* Crochets pour un rendu hors ligne (export image par image et piste
   sonore) : PROMO.render force les effets alors que la timeline est
   déplacée à la main. Sans effet en lecture normale. */
PROMO.audio = AUDIO;
PROMO.sfx = SFX;
PROMO.render = false;
PROMO.timeline = () => master;
PROMO.beats = () => BEATS;

const qs = new URLSearchParams(location.search);
if (qs.get('hud') === '0' || CONFIG.ui.hud === false) stage.classList.add('no-hud');
buildMontage(qs.get('cut') || CONFIG.cut || 'long');
applyFormat(qs.get('format') || CONFIG.format || '16:9');
requestAnimationFrame(fit);
master.pause();
if (qs.has('autoplay')) start(0);
if (qs.has('record')) setTimeout(record, 300);

/* ==========================================================================
   Décor 3D — volontairement discret : quelques formes translucides qui
   flottent lentement et se recomposent une fois par chapitre. Aucun
   mouvement à la coupe : c'est le contenu qui rythme, pas le fond.
   Chargé en module séparé : si le CDN tombe, l'animation continue sans lui.
   ========================================================================== */
PROMO.initScene = function (THREE) {
  const canvas = document.getElementById('gl');
  const S = CONFIG.scene;
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (e) { return; }
  renderer.setPixelRatio(1);
  renderer.setSize(1920, 1080, false);
  renderer.setClearColor(0x000000, 0);

  const rnd = (a, b) => a + Math.random() * (b - a);
  const scene = new THREE.Scene();
  if (S.fog) scene.fog = new THREE.FogExp2(0x07040f, S.fog);
  const camera = new THREE.PerspectiveCamera(42, 16 / 9, .1, 200);
  const world  = new THREE.Group();
  scene.add(world);

  const NOISE = `
    vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
    vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
    float snoise(vec3 v){
      const vec2 Cc=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
      vec3 i=floor(v+dot(v,Cc.yyy)); vec3 x0=v-i+dot(i,Cc.xxx);
      vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
      vec3 x1=x0-i1+Cc.xxx; vec3 x2=x0-i2+Cc.yyy; vec3 x3=x0-D.yyy;
      i=mod289(i);
      vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
      float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
      vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
      vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
      vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
      vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
      vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
      vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
      vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
      p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
      vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
      return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
    }`;

  const VERT = NOISE + `
    uniform float uTime,uAmp,uFreq,uSeed;
    varying vec3 vN,vV; varying float vNo,vDepth;
    vec3 displaced(vec3 p,vec3 n){
      float t=uTime*0.28+uSeed;
      float d=snoise(p*uFreq+vec3(t,t*0.7,-t*0.5));
      d+=0.5*snoise(p*uFreq*2.1-vec3(t*0.6));
      return p+n*d*uAmp;
    }
    void main(){
      vec3 p=displaced(position,normal);
      vec3 t1=normalize(abs(normal.y)<0.99?cross(normal,vec3(0.0,1.0,0.0)):vec3(1.0,0.0,0.0));
      vec3 t2=cross(normal,t1);
      float e=0.06;
      vec3 pa=displaced(position+t1*e,normal), pb=displaced(position+t2*e,normal);
      vec3 n=normalize(cross(pa-p,pb-p));
      n*=sign(dot(n,normal));
      vNo=length(p)-length(position);
      vec4 mv=modelViewMatrix*vec4(p,1.0);
      vDepth=-mv.z;
      vN=normalize(normalMatrix*n);
      vV=normalize(-mv.xyz);
      gl_Position=projectionMatrix*mv;
    }`;

  const FRAG = `
    precision highp float;
    uniform vec3 uA,uB,uC; uniform float uOpacity,uTime,uSeed;
    varying vec3 vN,vV; varying float vNo,vDepth;
    void main(){
      float f=1.0-clamp(dot(normalize(vN),normalize(vV)),0.0,1.0);
      float rim=pow(f,2.6);
      float band=sin(vNo*7.0+f*5.0+uTime*0.35+uSeed)*0.5+0.5;
      vec3 col=mix(uA,uB,band);
      col=mix(col,uC,rim*0.4);
      /* les formes lointaines se dissolvent : de la profondeur, pas du bruit */
      float far=1.0-smoothstep(16.0,44.0,vDepth);
      float a=uOpacity*(0.05+rim*0.70)*far;
      gl_FragColor=vec4(col,clamp(a,0.0,1.0));
    }`;

  const c3 = CONFIG.colors.scene.map(h => new THREE.Color(h));
  const shapes = [
    () => new THREE.IcosahedronGeometry(1, 4),
    () => new THREE.SphereGeometry(1, 64, 44),
    () => new THREE.TorusGeometry(1, .36, 36, 110),
    () => new THREE.TorusKnotGeometry(.82, .27, 150, 26)
  ];
  const meshes = [], mats = [];
  const N = Math.max(4, Math.min(12, S.count | 0));

  for (let i = 0; i < N; i++) {
    const mat = new THREE.ShaderMaterial({
      vertexShader: VERT, fragmentShader: FRAG,
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uTime:    { value: rnd(0, 40) },
        uAmp:     { value: S.amp * rnd(.7, 1.3) },
        uFreq:    { value: rnd(.7, 1.6) },
        uSeed:    { value: rnd(0, 10) },
        uOpacity: { value: 1 },
        uA: { value: c3[0].clone() }, uB: { value: c3[1].clone() }, uC: { value: c3[2].clone() }
      }
    });
    mat.userData.base = rnd(.5, .9);
    mats.push(mat);

    const m = new THREE.Mesh(shapes[i % shapes.length](), mat);
    const sc = rnd(.75, 1.6);
    m.scale.setScalar(sc);
    m.rotation.set(rnd(0, 6.3), rnd(0, 6.3), rnd(0, 6.3));
    m.userData = {
      x0: rnd(-11, 11), y0: rnd(-5, 5), z0: rnd(-18, -6),
      sp: rnd(.10, .22), ph: rnd(0, 6.3), rx: rnd(-.03, .03), ry: rnd(-.04, .04),
      /* état initial mémorisé : tout se calcule à partir du temps absolu,
         donc une image rendue hors ligne est identique à sa lecture */
      rx0: m.rotation.x, ry0: m.rotation.y, t0: mat.uniforms.uTime.value
    };
    m.position.set(m.userData.x0, m.userData.y0, m.userData.z0);
    world.add(m);
    meshes.push(m);
  }

  /* dispositions : une par chapitre, atteinte en 2,4 s */
  const TAU = Math.PI * 2;
  const FORMS = {
    scatter: (i, n) => [((i * 7) % 11 - 5) * 2.4, ((i * 5) % 9 - 4) * 1.5, -9 - (i * 5.3) % 11],
    orbit:   (i, n) => { const a = i / n * TAU; return [Math.cos(a) * 10.5, Math.sin(a) * 5.8, -10 + Math.sin(a * 2) * 2.5]; },
    wall:    (i, n) => { const c = 4, x = (i % c) - (c - 1) / 2, y = Math.floor(i / c) - .5;
                         return [x * 7.0, y * 5.4, -13 + (i * 3) % 3]; },
    halo:    (i, n) => { const a = i / n * TAU; return [Math.cos(a) * 12, Math.sin(a) * 6.8, -11]; }
  };

  const cam = { z: 15, y: 0 };
  const state = { op: .55 };
  let blendNormal = false, curMood = -1;

  let zMul = 1;

  PROMO.scene = {
    /* le rendu suit le format de sortie */
    resize(w, h) {
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      zMul = w >= h ? 1 : 1.55;   // en vertical, on recule pour garder le cadre
      camera.updateProjectionMatrix();
    },

    /* appelé une seule fois par chapitre */
    chapter(i) {
      if (i === curMood) return;
      curMood = i;
      const moods = S.moods || [];
      const m = moods[Math.min(i, moods.length - 1)] || {};
      gsap.to(cam, { z: m.camZ == null ? 15 : m.camZ, y: m.camY || 0, duration: 2.4, ease: 'power2.inOut', overwrite: 'auto' });
      gsap.to(world.rotation, { y: m.rotY || 0, duration: 2.6, ease: 'power2.inOut', overwrite: 'auto' });
      gsap.to(state, { op: m.opacity == null ? .55 : m.opacity, duration: 2.0, ease: 'power2.inOut', overwrite: 'auto' });

      const form = FORMS[m.form] || FORMS.scatter;
      meshes.forEach((mesh, k) => {
        const t = form(k, meshes.length);
        gsap.to(mesh.userData, { x0: t[0], y0: t[1], z0: t[2],
          duration: 2.6, ease: 'power2.inOut', delay: k * .05, overwrite: 'auto' });
      });

      const normal = m.blend === 'normal';
      if (normal !== blendNormal) {
        blendNormal = normal;
        const bl = normal ? THREE.NormalBlending : THREE.AdditiveBlending;
        mats.forEach(mt => { mt.blending = bl; mt.needsUpdate = true; });
      }
    }
  };

  let last = performance.now();
  gsap.ticker.add(() => {
    const now = performance.now();
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const t = now / 1000;

    camera.position.set(0, cam.y, cam.z * zMul);
    camera.lookAt(0, cam.y * .3, -3);

    for (const m of meshes) {
      const u = m.userData;
      m.position.set(
        u.x0 + Math.cos(t * u.sp * .6 + u.ph) * .22,
        u.y0 + Math.sin(t * u.sp + u.ph) * .30,
        u.z0
      );
      m.rotation.x = u.rx0 + u.rx * t * S.speed * 4;
      m.rotation.y = u.ry0 + u.ry * t * S.speed * 4;
      m.material.uniforms.uTime.value = u.t0 + t * S.speed * 3;
      m.material.uniforms.uOpacity.value = m.material.userData.base * state.op;
    }
    renderer.render(scene, camera);
  });

  PROMO.scene.resize(STAGE_W, STAGE_H);
  if (curCh >= 0) PROMO.scene.chapter(curCh);
};

})();
</script>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}
</script>
<script type="module">
/* Three.js à part : s'il échoue, l'animation continue sans le décor. */
try {
  const THREE = await import('three');
  if (window.PROMO && window.PROMO.initScene) window.PROMO.initScene(THREE);
} catch (err) {
  console.warn('[promo] Three.js indisponible — décor 3D désactivé.', err);
}
</script>
